name: Build Android APK

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KalimaKalima.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KalimaKalima-apk
          path: KalimaKalima.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: كلمة كلمة 1.0.${{ github.run_number }}
          make_latest: "true"
          files: KalimaKalima.apk
          body: |
            تطبيق «كلمة كلمة» لتعلّم الإنكليزية، مصمَّم لمن يجد صعوبة في قراءة الكلمات الطويلة.

            التثبيت على أندرويد:
            1. نزّل ملف KalimaKalima.apk من الأسفل.
            2. افتحه، واسمح للمتصفح بتثبيت التطبيقات إذا طلب الهاتف ذلك.
            3. اضغط «تثبيت».
