name: Build PC Doctor installer

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths:
      - "pc_doctor/**"
      - ".github/workflows/pc-doctor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcdoctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc_doctor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pc_doctor/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pcdoctor/version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # يشغّل كل الفحوص على ويندوز حقيقي ويفشل إن تعطّل أي فحص
      - name: Self-test checks
        run: python tools/selftest.py

      - name: Build app and installer
        run: python tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: PCDoctor-${{ steps.ver.outputs.version }}-Setup
          path: pc_doctor/dist/PCDoctor-${{ steps.ver.outputs.version }}-Setup.exe

      # ينشر إصداراً جديداً فقط عند رفع رقم الإصدار؛ البرنامج المثبّت يكتشفه ويعرض التحديث
      - name: Publish release (new version only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pcdoctor-v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; bump the version with tools/bump_version.py to release."
            exit 0
          }
          gh release create $tag "dist/PCDoctor-${{ steps.ver.outputs.version }}-Setup.exe" `
            --target ${{ github.sha }} `
            --title "طبيب الحاسبة ${{ steps.ver.outputs.version }}" `
            --notes-file dist/release_notes.md `
            --latest=false
