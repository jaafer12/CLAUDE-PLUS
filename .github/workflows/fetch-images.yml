name: Fetch word photos

on:
  push:
    paths:
      - "tools/images.json"
      - "tools/fetch_images.py"
      - ".github/workflows/fetch-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Download photos from Wikimedia Commons
        run: python tools/fetch_images.py

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update word photos from Wikimedia Commons"
          git push origin HEAD:${{ github.ref_name }}
