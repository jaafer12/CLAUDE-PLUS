name: Record voices

on:
  push:
    paths:
      - "tools/gen_voice_kokoro.py"
      - ".github/workflows/voice.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: voice-${{ github.ref }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kokoro (CPU)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy

      - name: Record clips
        run: python tools/gen_voice_kokoro.py

      - name: Add clips to the app
        run: python tools/embed_voice.py

      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/audio web/app.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Record voice clips with Kokoro"
          git push origin HEAD:${{ github.ref_name }}
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Rebuild the APK
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref ${{ github.ref_name }}
