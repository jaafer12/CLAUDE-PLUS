name: Build Google TV launcher

on:
  push:
    branches: ["main", "master", "claude/**"]
    paths:
      - "tvlauncher/**"
      - ".github/workflows/tv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: tvlauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp tvlauncher/app/build/outputs/apk/release/app-release.apk JaaferTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JaaferTV-apk
          path: JaaferTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: جعفر TV 1.0.${{ github.run_number }}
          make_latest: "false"
          files: JaaferTV.apk
          body: |
            واجهة «جعفر TV» لأجهزة Google TV بأسلوب Apple TV.

            التثبيت: انظر tvlauncher/README.md في المستودع.
