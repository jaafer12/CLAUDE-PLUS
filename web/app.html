<title>كلمة كلمة</title>
<meta name="theme-color" content="#F8EEE2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@300..700&family=Readex+Pro:wght@300..700&display=swap">
<style>
/* Layout: a one-column phone app. A calm top bar, a scrolling stage, a bottom tab bar.
   English words always appear as coloured syllable chunks (beau·ti·ful) so long words never arrive as one block. */
@font-face{font-family:"KK Lexend";src:url("fonts/lexend.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"KK Readex";src:url("fonts/readex-pro-arabic.woff2") format("woff2");font-weight:160 700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"KK Readex";src:url("fonts/readex-pro-latin.woff2") format("woff2");font-weight:160 700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"KK OpenDyslexic";src:url("fonts/opendyslexic.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KK OpenDyslexic";src:url("fonts/opendyslexic-bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"KK Atkinson";src:url("fonts/atkinson.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KK Atkinson";src:url("fonts/atkinson-bold.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  /* Warm peach paper: Rello & Bigham (2017) found warm backgrounds help readers with dyslexia. Ink is navy, never pure black. */
  --bg:#F8EEE2; --surface:#FFF8EF; --sunk:#F0E2D1; --line:#E4D2BE;
  --ink:#22263A; --muted:#5F596B;
  --accent:#17696A; --accent-ink:#FFFFFF; --accent-soft:#D3E9E4;
  --syl1:#2452B5; --syl2:#B5400E; --hi:#FFE08A;
  --good:#24724A; --good-soft:#DCF0E2; --warn:#8F5300; --warn-soft:#FBE6C2;
  --scrim:rgba(24,20,14,.45);
  --shadow:0 1px 0 rgba(70,45,20,.05),0 8px 20px -12px rgba(70,45,20,.35);
  --f-ar:"KK Readex","Readex Pro","Noto Sans Arabic",system-ui,sans-serif;
  --f-en:"KK Lexend","Lexend","Atkinson Hyperlegible",system-ui,sans-serif;
  --scale:1; --track:.1em; --wspace:.45em;
  color-scheme:light;
}
:root[data-font="od"]{--f-en:"KK OpenDyslexic","KK Lexend","Lexend",system-ui,sans-serif}
:root[data-font="ah"]{--f-en:"KK Atkinson","Atkinson Hyperlegible","KK Lexend",system-ui,sans-serif}
:root[data-bg="cream"]{--bg:#FAF4E3;--surface:#FFFCF2;--sunk:#F0E7CF;--line:#E4D8BA}
:root[data-bg="blue"]{--bg:#E5EEF6;--surface:#F6FAFD;--sunk:#D6E3EF;--line:#C5D6E6}
:root[data-bg="mint"]{--bg:#E4F1E8;--surface:#F5FBF7;--sunk:#D3E8DA;--line:#C2DCCB}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A24; --surface:#1F2534; --sunk:#283043; --line:#323A50;
    --ink:#EEE7DC; --muted:#ABA5B6;
    --accent:#5CC8BF; --accent-ink:#0B1D1C; --accent-soft:#1D3A3A;
    --syl1:#93B4FF; --syl2:#FFA670; --hi:#53491C;
    --good:#7ED6A0; --good-soft:#1C3527; --warn:#F2C26B; --warn-soft:#3B2E14;
    --scrim:rgba(0,0,0,.6); --shadow:0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161A24; --surface:#1F2534; --sunk:#283043; --line:#323A50;
  --ink:#EEE7DC; --muted:#ABA5B6;
  --accent:#5CC8BF; --accent-ink:#0B1D1C; --accent-soft:#1D3A3A;
  --syl1:#93B4FF; --syl2:#FFA670; --hi:#53491C;
  --good:#7ED6A0; --good-soft:#1C3527; --warn:#F2C26B; --warn-soft:#3B2E14;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;font-size:calc(17px * var(--scale));-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ar);line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem 16px .5rem}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.05rem}
.brand b{color:var(--syl2);font-weight:700}
.brand-mark{display:inline-flex;gap:3px;align-items:center}
.brand-mark i{display:block;width:12px;height:18px;border-radius:5px;background:var(--syl1)}
.brand-mark i+i{background:var(--syl2)}
.top-r{display:flex;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}

#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:.5rem 16px 1.5rem;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:1.1rem}
#app.in-session .top,#app.in-session .tabs{display:none}
#app.in-session #view{padding-top:.8rem}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
.h1{font-size:1.55rem;font-weight:700}
.h2{font-size:1.15rem;font-weight:700}
.h3{font-size:1rem;font-weight:600}
p{margin:0}
.lead{color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:.85rem}
.label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.1rem;display:flex;flex-direction:column;gap:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:.6rem}

.btn{border:0;border-radius:14px;min-height:52px;padding:.7rem 1.1rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer;transition:transform .12s ease,background-color .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn.small{min-height:44px;padding:.45rem .9rem;font-size:.92rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:1.1rem;flex:none}

/* English words, syllable chunks */
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate;letter-spacing:var(--track);word-spacing:var(--wspace)}
.chunks{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate;letter-spacing:var(--track);word-spacing:var(--wspace);display:inline-block;max-width:100%;overflow-wrap:anywhere}
.chunks .sy{color:var(--syl1);border-radius:.22em;padding:0 .04em;transition:background-color .15s,transform .15s;display:inline-block}
.chunks .sy.s1{color:var(--syl2)}
.chunks .dot{color:var(--muted);opacity:.6;margin:0 .05em;font-weight:400}
.no-syl .chunks .sy{color:inherit;padding:0}
.no-syl .chunks .dot{display:none}
.chunks .sy.beat{background:var(--hi);transform:translateY(-3px)}
.chunks.speaking .sy{background:var(--hi)}
.chunks.xl{font-size:2.6rem;font-weight:500;line-height:1.3}
.chunks.xl.long{font-size:2.15rem}
.chunks.xl.xlong{font-size:1.8rem}
.chunks.lg{font-size:1.75rem;font-weight:500;line-height:1.35}
.chunks.md{font-size:1.3rem;font-weight:500;line-height:1.4}
.chunks.sm{font-size:1.05rem}
[data-say]{cursor:pointer}

.beats{display:flex;gap:.45rem;justify-content:center}
.beats i{width:.6rem;height:.6rem;border-radius:50%;background:var(--syl1)}
.beats i:nth-child(even){background:var(--syl2)}
.hint{color:var(--muted);font-size:1rem}
.no-hint .hint{display:none}
.mean{font-size:1.25rem;font-weight:600}

.pic{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",var(--f-en);line-height:1}
.pic-num{font-family:var(--f-en);font-weight:700;color:var(--accent);line-height:1}
.swatch{display:inline-block;width:1em;height:1em;border-radius:50%;border:2px solid var(--line);vertical-align:middle}
.pic-xl{font-size:4.6rem;text-align:center;line-height:1.1}
.photo{display:block;flex:none;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:var(--sunk);border:1px solid var(--line)}
.photo.xl{width:min(100%,340px);max-height:34vh}
.photo.lg{width:min(100%,280px);max-height:28vh}
.photo.opt{border-radius:14px;border:0}
.photo.thumb{width:3.2rem;height:3.2rem;aspect-ratio:1;border-radius:12px;flex:none}
.opt-pic:has(.photo){display:block;padding:.35rem;min-height:0}
.opt-pic:has(.photo) .reveal{display:block;margin-top:.2rem}
.credits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem;width:100%;text-align:start}
.credits li{display:flex;gap:.7rem;align-items:center}
.credits li div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;font-size:.82rem;overflow-wrap:anywhere;text-align:left}
.credits a{color:var(--accent)}
.pic-lg{font-size:3.4rem;text-align:center;line-height:1.1}

/* Home */
.hello h1{font-size:1.5rem}
.wotd{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:1.1rem 1.1rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;box-shadow:var(--shadow)}
.wotd-head{display:flex;justify-content:space-between;width:100%}
.wotd .mean{display:flex;gap:.5rem;align-items:center}
.today .top-line{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.big-num{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--f-en)}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar.thin{height:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;text-align:center}
.stats b{display:block;font-size:1.35rem;font-family:var(--f-en);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.tip{background:var(--accent-soft);border-radius:18px;padding:.9rem 1rem;display:flex;gap:.75rem;align-items:flex-start}
.tip p{flex:1;min-width:0}
.tip .icon-btn{width:38px;height:38px;font-size:.9rem;background:transparent;border-color:transparent}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.9rem .85rem;display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;text-align:start;cursor:pointer;min-width:0}
.cat:active{transform:scale(.98)}
.cat .pic{font-size:2rem}
.cat-ar{font-weight:700;font-size:1.02rem}
.cat-en{font-size:.85rem;color:var(--muted)}
.cat-foot{display:flex;align-items:center;gap:.5rem;width:100%;margin-top:.3rem}
.cat-n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--f-en)}
.cat.done{border-color:var(--accent)}

/* Session */
.s-head{display:flex;align-items:center;gap:.75rem}
.s-stars{font-family:var(--f-en);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.s-body{flex:1;display:flex;flex-direction:column;align-items:center;gap:.8rem;text-align:center}
.s-foot{position:sticky;bottom:0;background:var(--bg);padding-top:.6rem;display:flex;flex-direction:column;gap:.6rem}
.q{font-size:1.15rem;font-weight:600}
.example{width:100%;text-align:start;gap:.35rem}
.example .ex{font-size:1.15rem;line-height:1.6}
.example .ex b{font-weight:700}
.big-play{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2.4rem;cursor:pointer;box-shadow:var(--shadow)}
.big-play:active{transform:scale(.95)}
.link-btn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:.4rem .8rem;min-height:44px}
.opts-pic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;width:100%}
.opt-pic{background:var(--surface);border:2px solid var(--line);border-radius:20px;min-height:7.2rem;font-size:3.4rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.5rem}
.opt-pic .reveal{font-size:1rem}
.opts-word{display:flex;flex-direction:column;gap:.6rem;width:100%}
.opt-word{background:var(--surface);border:2px solid var(--line);border-radius:16px;min-height:64px;padding:.5rem 1rem;cursor:pointer}
.opt-word.reading,.opt-pic.reading{border-color:var(--syl1)}
.is-right{border-color:var(--good)!important;background:var(--good-soft)!important}
.is-wrong{border-color:var(--warn)!important;background:var(--warn-soft)!important}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;direction:ltr;min-height:3.8rem;align-items:center;width:100%}
.slot{min-width:3.4rem;height:3.6rem;border:2px dashed var(--line);border-radius:14px}
.slot-gap{width:.9rem}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;direction:ltr;width:100%}
.tile{font-family:var(--f-en);font-size:1.6rem;font-weight:500;letter-spacing:var(--track);min-width:3.4rem;height:3.6rem;padding:0 .9rem;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.tile.placed{background:var(--sunk);color:var(--syl1);border-color:transparent;box-shadow:none}
.tile.placed.s1{color:var(--syl2)}
.no-syl .tile.placed,.no-syl .tile.placed.s1{color:var(--ink)}
.tile.used{visibility:hidden}
.mic{width:110px;height:110px;border-radius:50%;border:0;background:var(--syl2);color:#fff;font-size:2.8rem;cursor:pointer;box-shadow:var(--shadow)}
.mic.listening{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.fb{border-radius:20px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.fb.good{background:var(--good-soft)}
.fb.warn{background:var(--warn-soft)}
.fb-msg{font-weight:700;font-size:1.15rem}
.fb.good .fb-msg{color:var(--good)}
.fb.warn .fb-msg{color:var(--warn)}
.fb-word{display:flex;flex-wrap:wrap;gap:.6rem;align-items:baseline;justify-content:center}
.result{align-items:center;text-align:center}
.result .pic-xl{font-size:4rem}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem;width:100%}
.wrow{width:100%;display:flex;align-items:center;gap:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.6rem .8rem;cursor:pointer;text-align:start;min-height:64px}
.wrow .pic{font-size:1.8rem;width:2.2rem;text-align:center;flex:none}
.wrow-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.lvl{display:flex;gap:3px;flex:none}
.lvl i{width:7px;height:16px;border-radius:3px;background:var(--sunk)}
.lvl i.on{background:var(--accent)}

/* Review boxes */
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;align-items:end;text-align:center}
.box-col{height:80px;display:flex;align-items:flex-end;justify-content:center}
.box-col i{display:block;width:70%;min-height:4px;height:var(--h);background:var(--accent);border-radius:8px 8px 3px 3px;opacity:calc(.35 + var(--o))}
.box b{display:block;font-family:var(--f-en);font-variant-numeric:tabular-nums}
.box span{font-size:.72rem;color:var(--muted);display:block;line-height:1.3}

/* Reader */
.rtools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;position:sticky;top:0;background:var(--bg);padding-block:.4rem;z-index:2}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;min-height:44px;padding:.3rem .9rem;cursor:pointer;font-size:.92rem}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.reading{font-size:1.4rem;line-height:2.15;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1rem 1.1rem;max-width:100%}
.reading p{margin:0 0 .9em}
.reading p:last-child{margin:0}
.reading .w{border-radius:.25em;cursor:pointer;white-space:nowrap}
.reading .w.on{background:var(--hi)}
.reading .sent{transition:opacity .25s}
.reading.ruler .sent{opacity:.3}
.reading.ruler .sent.on{opacity:1}
.sent.on{background:linear-gradient(transparent 82%,var(--hi) 82%)}
.ta{width:100%;min-height:12rem;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.9rem;font-size:1.2rem;line-height:1.8;resize:vertical}
.ta:focus{outline:3px solid var(--accent);outline-offset:1px}
.sample-note{font-size:.85rem;color:var(--muted)}

/* Settings */
.set h3{font-size:.95rem;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:.45rem}
.seg button{flex:1 1 30%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:.35rem .5rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw{display:inline-block;width:1.1rem;height:1.1rem;border-radius:50%;vertical-align:middle;border:1px solid rgba(128,128,128,.4);margin-inline-end:.35rem}
.preview{text-align:center;padding:.6rem;background:var(--bg);border-radius:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;background:none;border:0;min-height:52px;cursor:pointer;text-align:start;padding:0}
.toggle i{flex:none;width:52px;height:30px;border-radius:99px;background:var(--sunk);position:relative;transition:background-color .2s}
.toggle i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.toggle[aria-checked="true"] i{background:var(--accent)}
.toggle[aria-checked="true"] i::after{inset-inline-start:25px}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.about ol{margin:0;padding-inline-start:1.2rem;display:flex;flex-direction:column;gap:.6rem}
.about li span{display:block;font-size:.82rem;color:var(--muted)}

/* Sheet + toast + confetti */
.sheet-wrap{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:1.2rem 16px calc(1.2rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:14px;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:.95rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5;
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const plural = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10 ? `${n} ${few}` : `${n} ${many}`);
const P = {
  word: n => plural(n, 'كلمة واحدة', 'كلمتان', 'كلمات', 'كلمة'),

};

function picHTML(p, cls = '') {

/* ================= Spaced repetition (Leitner boxes) ================= */
const INT = [0, 1, 2, 4, 8, 16];
function touch(id) { if (!S.words[id]) S.words[id] = { b: 0, d: Date.now(), c: 0, x: 0 }; return S.words[id]; }
function grade(id, ok) {
  const now = Date.now(), r = touch(id);
  if (ok) {
    r.c++;
    if (r.b === 0 || r.d <= now) { r.b = Math.min(5, r.b + 1); r.d = startOfDay(now) + INT[r.b] * DAY; }
  } else { r.x++; r.b = 1; r.d = now; }
}
const dueWords = () => WORDS.filter(w => S.words[w.id] && S.words[w.id].d <= Date.now());
const seenWords = () => WORDS.filter(w => S.words[w.id]);
function countAnswer() { const k = dayKey(); S.days[k] = (S.days[k] || 0) + 1; }
function streakDays() {
  let n = 0, t = Date.now();
  if (!(S.days[dayKey(t)] > 0)) t -= DAY;
  while (S.days[dayKey(t)] > 0) { n++; t -= DAY; }
  return n;
}

/* ================= Syllables ================= */
const ONSETS = new Set(['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','sc','sk','sl','sm','sn','sp','st','sw','tr','tw','wr','ch','sh','th','ph','wh','qu']);
const DIGRAPH_BEFORE = new Set(['ch','sh','th','ph','wh','gh','qu']);
function syllabify(word) {
  const lower = word.toLowerCase();
  const known = BY.get(lower);
  if (known && !/\s/.test(known.sy)) {
    const parts = known.sy.split('·'); let i = 0;
    return parts.map(p => { const s = word.slice(i, i + p.length); i += p.length; return s; });
  }
  if (!/^[a-z]+$/.test(lower) || lower.length <= 3) return [word];
  for (const suf of ['ing', 'ful', 'ness', 'ment', 'less']) {
    const stem = lower.slice(0, -suf.length);
    if (lower.endsWith(suf) && stem.length >= 3 && /[aeiouy]/.test(stem)) {
      return [...syllabify(word.slice(0, -suf.length)), word.slice(-suf.length)];
    }
  }
  return coreSyl(word);
}
function coreSyl(word) {
  const s = word.toLowerCase(), n = s.length;
  const vowelAt = i => {
    const c = s[i];
    if ('aeiou'.includes(c)) return true;
    if (c === 'y') return i > 0 && !'aeiou'.includes(s[i - 1]);
    return false;
  };
  const v = [...s].map((_, i) => vowelAt(i));
  const consLe = n >= 4 && s.endsWith('le') && !vowelAt(n - 3);
  if (s.endsWith('e') && n > 3 && !consLe && v[n - 1]) v[n - 1] = false;           // silent final e
  if (/[^td]ed$/.test(s)) v[n - 2] = false;                                       // played, called
  if (/[^sxzhgc]es$/.test(s) && !consLe) v[n - 2] = false;                        // makes, names
  const consLes = n >= 5 && s.endsWith('les') && !vowelAt(n - 4);
  if (consLes) v[n - 2] = true;                                                   // tables
  const groups = [];
  for (let i = 0; i < n; i++) {
    if (v[i]) { if (groups.length && groups[groups.length - 1].e === i - 1) groups[groups.length - 1].e = i; else groups.push({ s: i, e: i }); }
  }
  if (groups.length <= 1) return [word];
  const cuts = [];
  for (let g = 0; g < groups.length - 1; g++) {
    const a = groups[g].e + 1, b = groups[g + 1].s, cl = s.slice(a, b), k = cl.length;
    const lastGroup = g + 1 === groups.length - 1;
    const leEnd = consLe ? n : (consLes ? n - 1 : 0);
    if (lastGroup && leEnd && b === leEnd - 1) { cuts.push(leEnd - 3); continue; }
    if (k === 0) continue;
    if (k === 1) { cuts.push(cl === 'x' ? b : a); continue; }
    if (k === 2) {
      if (DIGRAPH_BEFORE.has(cl)) cuts.push(a);
      else if (cl === 'ck') cuts.push(b);
      else cuts.push(a + 1);
      continue;
    }
    const tail = cl.slice(-2);
    if (ONSETS.has(tail) && !DIGRAPH_BEFORE.has(cl.slice(0, 2))) cuts.push(b - 2);
    else cuts.push(b - 1);
  }
  const out = []; let prev = 0;
  [...new Set(cuts)].sort((x, y) => x - y).forEach(c => { if (c > prev && c < n) { out.push(word.slice(prev, c)); prev = c; } });
  out.push(word.slice(prev));
  return out;
}

function chunks(sy, size = 'md') {

const NUMS = { one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', twenty: '20', hundred: '100', thousand: '1000' };
const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function heardOk(target, alts) {
  const t = norm(target);
  const forms = new Set([t, t.replace(/\bi am\b/, "i'm"), t.replace(/'/g, ''), NUMS[t] || t]);
  return alts.some(a => {
    const h = norm(a);
    return [...forms].some(f => h === f || (' ' + h + ' ').includes(' ' + f + ' ') || 1 - lev(h, f) / Math.max(h.length, f.length, 1) >= 0.75);
  });
}

/* ================= Sound + touch feedback ================= */
let actx = null;
function tone(seq) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    seq.forEach(([f, dt, dur, type = 'sine', vol = 0.12]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.linearRampToValueAtTime(vol, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + dur + 0.05);
    });
  } catch (e) { /* audio unavailable */ }
}
const SND = {
  ok: () => tone([[660, 0, 0.18], [880, 0.12, 0.3]]),
  soft: () => tone([[330, 0, 0.3, 'triangle', 0.08]]),
  tick: () => tone([[540, 0, 0.09, 'triangle', 0.07]]),
  win: () => tone([[523, 0, 0.22], [659, 0.15, 0.22], [784, 0.3, 0.4]]),
};
function buzz(ms) { try { if (NA && NA.vibrate) NA.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } }

function clap(host, text) {
  const sys = [...host.querySelectorAll('.chunks .sy')];
  if (!sys.length) return;
  Speech.stop();
  const step = Math.round(560 / Math.max(0.5, S.settings.rate));
  let i = 0;
  const tick = () => {
    sys.forEach(s => s.classList.remove('beat'));
    if (i < sys.length) { sys[i].classList.add('beat'); SND.tick(); buzz(25); i++; setTimeout(tick, step); }
    else setTimeout(() => sayWith(host.querySelector('.chunks'), text, Math.max(0.5, S.settings.rate - 0.25)), 150);
  };
  tick();
}
function sayWith(el, text, rate) {
  if (el) el.classList.add('speaking');
  Speech.speak(text, { rate, onEnd: () => el && el.classList.remove('speaking') });
}

/* ---------- Sessions ---------- */
function tokens(w) {
  const out = [];
  const words = w.sy.split(' ');
  if (words.length === 1 && !w.sy.includes('·')) {
    if (w.en.length <= 6) [...w.en].forEach((ch, i) => out.push({ t: ch, gap: false }));
    else out.push({ t: w.en, gap: false });
    return out;
  }
  words.forEach((wd, wi) => wd.split('·').forEach((p, pi) => out.push({ t: p, gap: wi > 0 && pi === 0 })));
  return out;
}
function exTypes() { return Speech.canListen() ? ['picture', 'build', 'speak'] : ['picture', 'build', 'picture', 'speak']; }
const ALT = { listen: 'picture', picture: 'listen', build: 'listen', speak: 'listen' };

function startLesson(catId) {
  const cat = CAT[catId];
  let pick = cat.words.filter(w => !S.words[w.id]).slice(0, 5), fresh = true;
  if (!pick.length) { pick = shuffle(cat.words).sort((a, b) => S.words[a.id].b - S.words[b.id].b).slice(0, 5); fresh = false; }
  const steps = [];
  if (fresh) {
    pick.forEach(w => { steps.push({ t: 'intro', w }); steps.push({ t: 'listen', w }); });
    shuffle(pick).forEach(w => steps.push({ t: shuffle(exTypes())[0], w }));
  } else {
    shuffle(pick).forEach(w => steps.push({ t: 'listen', w }));
    shuffle(pick).forEach(w => steps.push({ t: shuffle(exTypes())[0], w }));
  }
  beginSession({ kind: 'lesson', title: cat.ar, cat: catId, steps, words: pick });
}
function startReview(practice) {
  const pool = practice ? shuffle(seenWords()).slice(0, 8) : shuffle(dueWords()).slice(0, 10);
  if (!pool.length) { toast('لا توجد كلمات الآن'); return; }
  const types = ['listen', 'picture', 'build', 'listen', 'picture'];
  if (Speech.canListen()) types.push('speak');
  beginSession({ kind: practice ? 'practice' : 'review', title: practice ? 'تدريب سريع' : 'مراجعة', steps: pool.map(w => ({ t: shuffle(types)[0], w })), words: pool });
}
function beginSession(o) { SES = { ...o, i: 0, stars: 0, correct: 0, answered: 0, retried: new Set() }; render(); }

function options(w, n) {
  const sameCat = CAT[w.cat].words.filter(x => x.id !== w.id && x.pic !== w.pic);
  let pool = shuffle(sameCat).slice(0, n - 1);
  if (pool.length < n - 1) pool = pool.concat(shuffle(WORDS.filter(x => x.id !== w.id && !pool.includes(x) && x.pic !== w.pic)).slice(0, n - 1 - pool.length));
  return shuffle([w, ...pool]);
}

function syllIndex(st, pos) { let n = 0; for (let i = pos; i > 0 && !st.tok[i].gap; i--) n++; return n; }

}
function afterStep() {
  const st = SES.steps[SES.i];

}

const PRAISE = ['أحسنت!', 'ممتاز!', 'رائع، استمر!', 'صحيح!', 'عظيم!', 'برافو!'];
function answer(ok, pickedId) {
  const st = SES.steps[SES.i];
  if (st.answered) return;
  st.answered = true;
  const w = st.w;

  countAnswer(); SES.answered++;
  if (ok) { SES.correct++; if (!st.retry) { SES.stars++; S.stars++; } SND.ok(); buzz(30); }
  else {
    SND.soft(); buzz(70);
    if (!SES.retried.has(w.id)) { SES.retried.add(w.id); SES.steps.push({ t: ALT[st.t], w, retry: true }); }
  }
  save();
  view.querySelectorAll('[data-act="pick"]').forEach(b => {
    b.disabled = true;

    const rv = b.querySelector('.reveal'); if (rv) rv.hidden = false;
  });

  D.getElementById('foot').innerHTML = `<div class="fb ${ok ? 'good' : 'warn'}" role="status">
    <div class="fb-msg">${ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : (st.t === 'speak' ? 'قريب! اسمعها وحاول مرة ثانية لاحقاً.' : 'لا بأس، هذه هي الكلمة:')}</div>

    <button class="btn btn-primary btn-block" data-act="next">التالي</button></div>`;
  if (!ok) setTimeout(() => Speech.speak(w.en, { rate: Math.max(0.5, S.settings.rate - 0.15) }), 400);

}

function readerText() { return S.readerText == null ? SAMPLE : S.readerText; }
function viewReader() {
  const text = readerText();
  if (READER.editing || !text.trim()) {
    return `<h1 class="h1">القارئ</h1>

  }
  let si = 0;
  const paras = text.split(/\n\s*\n|\n/).filter(p => p.trim()).map(p => {
    const sents = p.match(/[^.!?]+[.!?]*["')\]]*\s*/g) || [p];

      let html = '', off = 0;

        } else html += esc(tok);

  return `<h1 class="h1">القارئ</h1>
  <div class="rtools">
    <button class="btn btn-primary small" data-act="readerPlay">${READER.playing ? '⏸ إيقاف' : '▶ اقرأ لي'}</button>

}
function readerPlayFrom(i) {
  const sents = [...view.querySelectorAll('.reading .sent')];
  view.querySelectorAll('.reading .on').forEach(e => e.classList.remove('on'));
  if (!READER.playing || i >= sents.length) { READER.playing = false; READER.cur = -1; const b = view.querySelector('[data-act="readerPlay"]'); if (b) b.textContent = '▶ اقرأ لي'; return; }
  const el = sents[i]; READER.cur = i; el.classList.add('on');
  el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  const raw = el.dataset.text, lead = (el.textContent.length - el.textContent.trimStart().length);
  const words = [...el.querySelectorAll('.w')];
  Speech.speak(raw, {
    onWord: c => { words.forEach(x => x.classList.remove('on')); const hit = words.filter(x => +x.dataset.o - lead <= c).pop(); if (hit) hit.classList.add('on'); },
    onEnd: cancelled => { if (!cancelled && READER.playing) setTimeout(() => readerPlayFrom(i + 1), 250); },
  });
}

/* ---------- Sheet, toast, confetti ---------- */
const sheet = D.getElementById('sheet');
function openSheet(html) { sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" data-clap-host><span class="grab" aria-hidden="true"></span>${html}</div>`; sheet.hidden = false; }
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ''; }
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
function wordSheet(raw) {
  const id = raw.toLowerCase();
  const w = BY.get(id) || (id.endsWith('es') && BY.get(id.slice(0, -2))) || (id.endsWith('s') && BY.get(id.slice(0, -1))) || null;
  const exact = w && w.id === id;
  const sy = exact ? w.sy : syllabify(raw).join('·');
  const n = sy.split(/[·\s]+/).length;
  openSheet(`${w ? visual(w, 'lg') : ''}
    <div data-say="${esc(raw)}">${chunks(sy, 'xl')}</div>${beats(n)}<p class="label">${P.syl(n)}</p>
    ${exact ? `<p class="hint">${esc(w.say)}</p>` : ''}
    ${w ? `<p class="mean">${exact ? '' : `من كلمة <span class="en">${esc(w.en)}</span>: `}${esc(w.ar)}</p>` : `<p class="muted">هذه الكلمة ليست في الدروس بعد. التقسيم تلقائي وقد يختلف قليلاً عن القاموس.</p>`}
    <div class="row center">
      <button class="btn btn-soft small" data-act="say" data-text="${esc(raw)}">🔊 استمع</button>
      <button class="btn btn-ghost small" data-act="say" data-text="${esc(raw)}" data-slow="1">🐢 ببطء</button>
      <button class="btn btn-ghost small" data-act="clap" data-text="${esc(raw)}">👏 صفّق</button>
    </div>
    ${w && !S.words[w.id] ? `<button class="btn btn-primary btn-block" data-act="addWord" data-id="${esc(w.id)}">أضفها إلى مراجعتي</button>` : ''}
    <button class="btn btn-ghost btn-block" data-act="closeSheet">إغلاق</button>`);
  sayWith(sheet.querySelector('.chunks'), raw);
}
let toastT = 0;
function toast(msg) { const t = D.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = D.getElementById('confetti'), ctx = c.getContext('2d');
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(root), cols = ['--syl1', '--syl2', '--accent', '--hi'].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 110 }, () => ({ x: c.width / 2, y: c.height * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 11 - 3, r: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.a += 0.1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (t - t0 < 1800) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}

/* ================= Events ================= */
D.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    const s = e.target.closest('[data-say]');
    if (s) sayWith(s.querySelector('.chunks'), s.dataset.say);
    return;
  }
  const act = el.dataset.act, st = SES && !SES.finished ? SES.steps[SES.i] : null;
  switch (act) {
    case 'tab': closeSheet(); go(el.dataset.tab); break;
    case 'say': {
      const host = el.closest('[data-clap-host]');
      sayWith(host && host.querySelector('.chunks'), el.dataset.text, el.dataset.slow ? Math.max(0.45, S.settings.rate - 0.35) : S.settings.rate);
      break;
    }
    case 'clap': { const host = el.closest('[data-clap-host]') || view; clap(host, el.dataset.text); break; }
    case 'lesson': closeSheet(); startLesson(el.dataset.cat); break;
    case 'review': startReview(false); break;
    case 'practice': startReview(true); break;
    case 'tipClose': S.tip = false; save(); el.closest('.tip').remove(); break;
    case 'next': nextStep(); break;
    case 'exit':
      openSheet(`<h2 class="h2">تريد الخروج؟</h2><p class="muted">الكلمات التي أجبت عنها محفوظة.</p>
        <button class="btn btn-primary btn-block" data-act="closeSheet">أكمل</button><button class="btn btn-ghost btn-block" data-act="tab" data-tab="home">خروج</button>`);
      break;
    case 'closeSheet': closeSheet(); break;
    case 'pick': if (st) answer(el.dataset.id === st.w.id, el.dataset.id); break;
    case 'readOpts': {
      const btns = [...view.querySelectorAll('.opt-word')]; let i = 0;
      const nxt = () => {
        btns.forEach(b => b.classList.remove('reading'));
        if (i >= btns.length) return;
        const b = btns[i++]; b.classList.add('reading');
        Speech.speak(BY.get(b.dataset.id).en, { onEnd: c => { if (!c) setTimeout(nxt, 350); else btns.forEach(x => x.classList.remove('reading')); } });
      };
      nxt(); break;
    }
    case 'place': case 'unplace': {
      if (!st || st.answered) break;
      if (act === 'place') { const k = +el.dataset.k; if (!st.placed.includes(k)) st.placed.push(k); SND.tick(); }
      else st.placed.splice(+el.dataset.pos, 1);
      D.getElementById('buildArea').innerHTML = buildHTML(st);
      if (st.placed.length === st.tok.length) {
        const ok = st.placed.every((k, i) => st.tok[k].t.toLowerCase() === st.tok[i].t.toLowerCase());
        if (ok) answer(true);
        else {
          answer(false);
          st.placed = st.tok.map((_, i) => i);
          D.getElementById('buildArea').innerHTML = buildHTML(st);
        }
      }
      break;
    }
    case 'mic': {
      if (!st || st.answered) break;
      const mic = D.getElementById('mic'), ms = D.getElementById('micStatus');
      mic.classList.add('listening'); ms.textContent = 'أستمع إليك الآن…';
      Speech.listen().then(alts => {
        mic.classList.remove('listening');
        ms.innerHTML = alts.length ? `سمعتُ: <span class="en">${esc(alts[0])}</span>` : '';
        answer(heardOk(st.w.en, alts));
      }).catch(err => {
        mic.classList.remove('listening');
        if (Speech.isBlocked()) { ms.textContent = 'الميكروفون غير متاح. قل الكلمة بصوت عالٍ ثم اضغط «قلتها».'; mic.hidden = true; D.getElementById('foot').innerHTML = footHTML(st); }
        else ms.textContent = 'لم أسمع جيداً. اضغط وحاول مرة أخرى.';
      });
      break;
    }
    case 'selfSpeak': if (st) { st.retry = true; answer(true); } break;
    case 'skipSpeak': nextStep(); break;
    case 'word': wordSheet(el.dataset.w); break;
    case 'rword': {
      const sent = el.closest('.sent');
      if (READER.ruler && !READER.playing) { view.querySelectorAll('.reading .sent.on').forEach(x => x.classList.remove('on')); sent.classList.add('on'); }
      wordSheet(el.dataset.w); break;
    }
    case 'addWord': grade(el.dataset.id, true); save(); closeSheet(); toast('أُضيفت إلى مراجعتك'); if (TAB === 'review') render(); break;
    case 'readerPlay':
      READER.playing = !READER.playing;
      el.textContent = READER.playing ? '⏸ إيقاف' : '▶ اقرأ لي';
      if (READER.playing) readerPlayFrom(Math.max(0, READER.cur)); else { Speech.stop(); view.querySelectorAll('.reading .w.on').forEach(x => x.classList.remove('on')); }
      break;
    case 'readerRuler': READER.ruler = !READER.ruler; el.setAttribute('aria-pressed', READER.ruler); view.querySelector('.reading').classList.toggle('ruler', READER.ruler); if (READER.ruler && !view.querySelector('.reading .sent.on')) { const f = view.querySelector('.reading .sent'); if (f) f.classList.add('on'); } break;
    case 'readerEdit': READER.editing = true; READER.playing = false; READER.cur = -1; render(); break;
    case 'readerDone': S.readerText = D.getElementById('readerText').value; save(); READER.editing = false; render(); break;
    case 'readerSample': S.readerText = null; save(); READER.editing = false; render(); break;
    case 'readerClear': D.getElementById('readerText').value = ''; D.getElementById('readerText').focus(); break;
    case 'set': {
      const k = el.dataset.key, raw = el.dataset.val;
      S.settings[k] = (k === 'size' || k === 'track') ? Number(raw) : raw;
      save(); applySettings();
      el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el));
      break;
    }
    case 'toggle': S.settings[el.dataset.key] = !S.settings[el.dataset.key]; save(); applySettings(); el.setAttribute('aria-checked', S.settings[el.dataset.key]); break;
    case 'credits':
      openSheet(`<h2 class="h2">مصادر الصور</h2><p class="muted sm">كل الصور من ويكيميديا كومنز (Wikimedia Commons) برخص حرة. شكراً لأصحابها.</p>
        <ul class="credits">${Object.entries(PHOTOS).map(([id, [a, l, u]]) => `<li><img class="photo thumb" src="img/${slug(id)}.webp" alt="" loading="lazy" data-pic="${esc(BY.get(id).pic)}" data-kind="thumb"><div dir="ltr"><b class="en">${esc(BY.get(id).en)}</b><span>${esc(a)} · ${esc(l)}</span>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">صفحة الصورة</a>` : ''}</div></li>`).join('')}</ul>
        <button class="btn btn-ghost btn-block" data-act="closeSheet">إغلاق</button>`);
      break;
    case 'resetAsk':
      openSheet(`<h2 class="h2">مسح كل التقدّم؟</h2><p class="muted">ستُحذف الكلمات والنجوم والأيام المتتالية. الإعدادات تبقى كما هي.</p>
        <button class="btn btn-primary btn-block" data-act="closeSheet">إلغاء</button><button class="btn btn-ghost btn-block" data-act="reset">نعم، امسح التقدّم</button>`);
      break;
    case 'reset': { const keep = S.settings; S = JSON.parse(JSON.stringify(DEFAULT)); S.settings = keep; save(); closeSheet(); toast('تم مسح التقدّم'); go('home'); break; }
  }
});
D.addEventListener('input', e => {
  if (e.target.id === 'rate') { S.settings.rate = Number(e.target.value); D.getElementById('rateVal').textContent = Math.round(S.settings.rate * 100) + '%'; save(); }
});
D.addEventListener('error', e => {
  const t = e.target;
  if (t.tagName === 'IMG' && t.classList.contains('photo') && t.dataset.pic) {
    const box = D.createElement('div'); box.innerHTML = picBlock(t.dataset.pic, t.dataset.kind);
    t.replaceWith(box.firstElementChild || box);
  }
}, true);
D.addEventListener('visibilitychange', () => { if (D.hidden) { Speech.stop(); READER.playing = false; } });

/* Android back button: returns true when the app handled it. */
window.__onBack = () => {
  if (!sheet.hidden) { closeSheet(); return true; }
  if (SES && !SES.finished) { D.querySelector('[data-act="exit"]').click(); return true; }
  if (SES || TAB !== 'home') { go('home'); return true; }
  return false;
};

applySettings();
render();
})();
</script>
