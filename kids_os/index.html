<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="nujoom.appcache">
<head>
<meta charset="utf-8">
<title>نجوم</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نجوم">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-startup-image" href="icon.png">
<link rel="stylesheet" href="css/os.css">
</head>
<body>

<!-- شاشة الإقلاع -->
<div id="boot">
  <div class="boot-logo">⭐</div>
  <div class="boot-name">نجوم</div>
  <div class="boot-bar"><div id="bootFill"></div></div>
</div>

<!-- شاشة القفل -->
<div id="lock" class="hidden">
  <div class="lock-time" id="lockTime">--:--</div>
  <div class="lock-date" id="lockDate"></div>
  <div class="lock-hello" id="lockHello">أهلاً بك!</div>
  <div class="slider" id="unlockSlider">
    <div class="slider-text">اسحب النجمة للفتح ←</div>
    <div class="slider-knob" id="unlockKnob">⭐</div>
  </div>
</div>

<!-- سطح المكتب -->
<div id="desk" class="hidden">
  <div id="statusbar">
    <div class="sb-right"><span id="sbName">نجوم</span></div>
    <div class="sb-center" id="sbTime">--:--</div>
    <div class="sb-left"><span id="sbSound">🔊</span><span class="sb-stars">⭐ <b id="sbStars">0</b></span></div>
  </div>

  <div id="home">
    <div class="greet" id="greet"></div>
    <div id="grid"></div>
    <div id="dock"></div>
  </div>

  <div id="windows"></div>

</div>

<!-- رسائل -->
<div id="toast" class="hidden"><div class="toast-emoji" id="toastEmoji">⭐</div><div class="toast-text" id="toastText"></div></div>
<div id="modal" class="hidden"><div class="modal-box"><div class="modal-text" id="modalText"></div><div class="modal-btns" id="modalBtns"></div></div></div>

<script src="js/os.js"></script>
<script src="js/photos.js"></script>
<script src="js/app-board.js"></script>
<script src="js/app-circuit.js"></script>
<script src="js/app-water.js"></script>
<script src="js/app-float.js"></script>
<script src="js/app-magnet.js"></script>
<script src="js/app-colors.js"></script>
<script src="js/app-plant.js"></script>
<script src="js/app-quiz.js"></script>
<script src="js/app-stars.js"></script>
<script src="js/app-settings.js"></script>
<script>OS.start();</script>
</body>
</html>
