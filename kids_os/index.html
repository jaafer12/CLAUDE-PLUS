<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="nujoom.appcache">
<head>
<meta charset="utf-8">
<title>نجوم</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- default: يبدأ النظام تحت شريط ساعة الآيباد فلا يتداخل معه -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="نجوم">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/os.css">
</head>
<body>

<!-- شاشة الإقلاع -->
<div id="boot">
  <div class="boot-logo" id="bootLogo"></div>
  <div class="boot-name">نجوم</div>
  <div class="boot-bar"><div id="bootFill"></div></div>
</div>

<!-- سطح المكتب -->
<div id="desk">
  <div id="home">
    <div class="topbar">
      <div><div class="hello" id="hello"></div><div class="date" id="date"></div></div>
      <div class="chips">
        <div class="chip" id="starChip"><span class="ic" id="starIcon"></span><b id="sbStars">0</b></div>
        <div class="chip round" id="gearChip"><span class="ic" id="gearIcon"></span></div>
      </div>
    </div>
    <div id="grid"></div>
  </div>
  <div id="windows"></div>
</div>

<!-- رسائل -->
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"><div class="modal-box"><div class="modal-text" id="modalText"></div><div class="modal-btns" id="modalBtns"></div></div></div>

<script src="js/os.js"></script>
<script src="js/icons.js"></script>
<script src="js/photos.js"></script>
<script src="js/quran.js"></script>
<script src="js/app-quran.js"></script>
<script src="js/app-board.js"></script>
<script src="js/app-circuit.js"></script>
<script src="js/app-water.js"></script>
<script src="js/app-float.js"></script>
<script src="js/app-magnet.js"></script>
<script src="js/app-colors.js"></script>
<script src="js/app-plant.js"></script>
<script src="js/app-shadow.js"></script>
<script src="js/app-fall.js"></script>
<script src="js/app-cycle.js"></script>
<script src="js/app-balance.js"></script>
<script src="js/app-stars.js"></script>
<script src="js/app-settings.js"></script>
<script>OS.start();</script>
</body>
</html>
